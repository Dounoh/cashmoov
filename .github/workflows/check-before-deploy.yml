name: CHECK_BEFORE_DEPLOY

on:
  push:
    branches:
      - '**'
    # branches-ignore:
    #   - 'main'

  pull_request:
    branches:
      - '**'

  # Optionnel: permet de déclencher manuellement
  # workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  check_syntaxe:
    runs-on: ubuntu-latest  # Correction: tiret au lieu de underscore
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'  # Correction: version-file au singulier

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  check_dependances:
    runs-on: ubuntu-latest  # Correction: tiret au lieu de underscore
    needs: check_syntaxe  # Correction: pas de guillemets inutiles
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'  # Correction: version-file au singulier

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 dependencies check
        run: |
          flake8 . --exit-zero

  security-audit:
    runs-on: ubuntu-latest
    needs: check_dependances
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'  # Correction: version-file au singulier

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.0.0
        with:
          inputs: requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: security-audit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: cashmoov
          POSTGRES_PASSWORD: cashmoov
          POSTGRES_DB: cashmoov_test
          DATABASE_URL: postgres://cashmoov:cashmoov@postgres:5432/cashmoov_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Bake action
        uses: docker/bake-action@v6
        with:
          push: false
          load: true
          files: compose.yml
          targets: django
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Check migrations
        run: |
          docker compose run --rm django python manage.py makemigrations --check

      - name: Run migrations
        run: |
          docker compose run --rm django python manage.py migrate

      - name: Run tests with pytest
        run: |
          docker compose run --rm django pytest

      - name: Stop test containers
        if: always() # S'assure que cette étape s'exécute même si les précédentes échouent
        run: |
          docker compose down -v
