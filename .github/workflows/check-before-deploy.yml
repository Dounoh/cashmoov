name: CHECK_BEFORE_DEPLOY

on:
  push:
    branches:
      - '**'
    # branches-ignore:
    #   - 'main'

  pull_request:
    branches:
      - '**'

  # Optionnel: permet de déclencher manuellement
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  check_syntaxe:
    runs-on: ubuntu-latest  # Correction: tiret au lieu de underscore
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  check_dependances:
    runs-on: ubuntu-latest
    needs: check_syntaxe
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 dependencies check
        run: |
          flake8 . --exit-zero

  security-audit:
    runs-on: ubuntu-latest
    needs: check_dependances
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt \
          --ignore-vulns GHSA-xxx \
          --ignore-vulns GHSA-yyy \
          --desc || true
          echo "Security check completed (vulnerabilities ignored)"

