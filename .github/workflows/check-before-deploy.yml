name: CHECK_BEFORE_DEPLOY

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  check_syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  check_dependencies:
    runs-on: ubuntu-latest
    needs: check_syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8
        run: flake8 . --exit-zero

  security_audit:
    runs-on: ubuntu-latest
    needs: check_dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc

  test:
    runs-on: ubuntu-latest
    needs: security_audit

    env:
      DATABASE_URL: postgresql://cashmoov:cashmoov@localhost:5432/cashmoov_test
      DEBUG: "False"
      DJANGO_SECRET_KEY: django-insecure-5pnnjh3p^m^-%$vv8+^px-3r(8g9g)a_5cck%y#dgqqb9@bak6
      DJANGO_SETTINGS_MODULE: config.settings
      CI: "true"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cashmoov
          POSTGRES_PASSWORD: cashmoov
          POSTGRES_DB: cashmoov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest -v


  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_ACCOUNT }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .  
          file: ./compose/prod/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_ACCOUNT }}/cashmoov-api:latest

  pull_and_deploye:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Build and deploy server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST_CHATBOT}}
          key: ${{secrets.SSH_KEY_CHATBOT}}
          username: ${{ secrets.SSH_USERNAME_CHATBOT }}

          script: |
            cd backend/
            git pull origin staging
            docker pull ${{ vars.DOCKER_ACCOUNT }}/cashmoov-api:latest
            docker compose -f docker-compose.pro.yml run --rm django python manage.py migrate 
            docker compose -f docker-compose.pro.yml up -d
            docker image prune -a -f
